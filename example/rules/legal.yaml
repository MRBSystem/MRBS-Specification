# Legal Guidelines
# Trademark, copyright, and compliance requirements

trademark:
  description: "Trademark usage and protection"
  
  symbols:
    registered:
      symbol: "®"
      usage: "For registered trademarks"
      placement: "Superscript after trademark on first prominent use"
      example: "Acme® Analytics Platform"
      
    unregistered:
      symbol: "™"
      usage: "For unregistered trademarks"
      placement: "Superscript after trademark"
      example: "SmartConnect™"
      
    service_mark:
      symbol: "℠"
      usage: "For service marks"
      placement: "Superscript after mark"
      
  proper_usage:
    rules:
      - "Always use as adjective, never as noun or verb"
      - "Never pluralize trademark names"
      - "Never make possessive"
      - "Maintain consistent capitalization"
      - "Use generic term after trademark"
      
    examples:
      correct:
        - "Acme® software helps teams collaborate"
        - "The Acme® platform includes..."
        - "Use Acme® tools to improve..."
        
      incorrect:
        - "Acmes are great for teams"
          reason: "Pluralized trademark"
        - "Acme's features include..."
          reason: "Possessive form"
        - "You should Acme your workflow"
          reason: "Used as verb"
        - "The ACME platform"
          reason: "Inconsistent capitalization"
          
  third_party:
    rules:
      - "Always use third-party trademarks correctly"
      - "Include appropriate trademark symbols"
      - "Never imply endorsement without permission"
      - "Use current official product names"
      
    common_marks:
      - name: "Microsoft®"
        products: ["Windows®", "Office 365®", "Azure®"]
      - name: "Apple®"
        products: ["iPhone®", "iPad®", "macOS®"]
      - name: "Google™"
        products: ["Google Workspace™", "Android™"]

copyright:
  notice:
    format: "© [Year] [Legal Entity Name]. All rights reserved."
    current: "© 2025 Acme Corporation. All rights reserved."
    
  placement:
    - location: "Website footer"
      required: true
    - location: "Document footer"
      required: true
    - location: "Presentation last slide"
      required: false
    - location: "Email signature"
      required: false
      
  date_rules:
    single_year: "Use year of first publication"
    range: "Use 'YYYY-YYYY' for updated works"
    example: "© 2020-2025 Acme Corporation"
    
  reserved_rights:
    standard: "All rights reserved."
    alternative: "Some rights reserved." 
    note: "Use 'Some rights reserved' only with explicit licensing"

disclaimers:
  description: "Required disclaimer text by context"
  
  contexts:
    financial_projections:
      required_when: 
        - "Forward-looking statements"
        - "Revenue projections"
        - "Growth forecasts"
      text: "This document contains forward-looking statements that involve risks and uncertainties. Actual results may differ materially from those projected."
      placement: "Footer or end of section"
      
    testimonials:
      required_when:
        - "Customer quotes about results"
        - "Case study claims"
        - "Success metrics"
      text: "Individual results may vary. Past performance does not guarantee future results."
      
    professional_advice:
      required_when:
        - "Legal information"
        - "Financial guidance"
        - "Medical/health content"
      text: "This information is provided for educational purposes only and does not constitute professional advice. Please consult qualified professionals for your specific situation."
      
    beta_features:
      required_when:
        - "Preview or beta functionality"
        - "Experimental features"
      text: "This feature is currently in beta. Functionality may change and is not covered by standard SLAs."
      
    ai_generated:
      required_when:
        - "Content generated by AI"
        - "AI-assisted analysis"
      text: "This content was generated with AI assistance. Please verify important information independently."

privacy:
  data_collection:
    notice_required: true
    elements:
      - "What data is collected"
      - "How it will be used"
      - "How to opt out"
      
  gdpr:
    applies_to: "EU residents' data"
    requirements:
      - "Clear consent mechanism"
      - "Data access requests"
      - "Right to deletion"
      - "Data portability"
      
  ccpa:
    applies_to: "California residents' data"
    requirements:
      - "Do not sell my information option"
      - "Data disclosure upon request"

image_usage:
  stock_photography:
    requirements:
      - "Verify licensing allows intended use"
      - "Check if attribution required"
      - "Confirm commercial use rights"
      - "Keep license documentation"
      
    prohibited:
      - "Using images beyond license scope"
      - "Claiming ownership of licensed images"
      - "Sublicensing without permission"
      
  model_releases:
    required_when:
      - "Identifiable people in photos"
      - "Testimonial imagery"
      - "Marketing materials with people"
    not_required_when:
      - "Crowd scenes (no individual focus)"
      - "Public figures in news context"
      
  photographer_credit:
    required: "When specified by license"
    format: "Photo: [Photographer Name]"
    placement: "Image caption or credits section"

accessibility_compliance:
  wcag:
    target: "WCAG 2.1 Level AA"
    applies_to:
      - "Public websites"
      - "Customer-facing applications"
      - "Marketing materials"
      
  ada:
    description: "Americans with Disabilities Act"
    applies_to: "US operations"
    
  section_508:
    description: "Federal accessibility requirements"
    applies_to: "Government contracts"

export_compliance:
  encryption:
    note: "Products with encryption may have export restrictions"
    action: "Consult legal before international distribution"
    
  sanctions:
    note: "Cannot do business with sanctioned countries/entities"
    action: "Screen all transactions against OFAC list"

document_retention:
  policies:
    contracts: "7 years after expiration"
    financial_records: "7 years"
    employee_records: "7 years after termination"
    marketing_materials: "3 years"
    
  secure_disposal:
    required_for:
      - "Confidential documents"
      - "Personal data"
      - "Financial information"
